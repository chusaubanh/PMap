name: Build PMap Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../release_output
          cp app/build/outputs/apk/debug/app-debug.apk ../release_output/PMap.apk
          ls -la ../release_output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMap-Android-App
          path: release_output/PMap.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "PMap v1.0.0 (Bản Cài Đặt Xe Máy)"
          body: |
            ## 🏍️ PMap v1.0.0 — Bản Cài Đặt Android APK Hoàn Chỉnh
            - Giám sát tốc độ GPS thực tế & cảnh báo vượt tốc độ
            - Phủ sóng toàn bản đồ Việt Nam & 45+ camera phạt nguội trọng điểm
            - Song hành 2 chế độ: Bản đồ toàn diện thay thế Google Maps & Bong bóng nổi đè Google Maps
            - Giọng nói cảnh báo tiếng Việt qua tai nghe Bluetooth
          files: release_output/PMap.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
